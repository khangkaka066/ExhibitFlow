name: build-vast-image
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base vastai/pytorch (đúng tag trong template Vast)"
        default: "vastai/pytorch:latest"
  push:
    branches: [Hung]
    paths: ["exhibitflow_pipeline/**", "web/**", "Makefile", ".github/workflows/docker-vast.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Giải phóng dung lượng runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null; df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tên image (chữ thường)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/exhibitflow" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: exhibitflow_pipeline/docker/Dockerfile.vast
          push: true
          build-args: BASE_IMAGE=${{ inputs.base_image || 'vastai/pytorch:latest' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
